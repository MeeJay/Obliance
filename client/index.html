<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Obli Design v1 typography — sans: Inter (body, UI chrome),
         display: Rajdhani (page titles + hero KPI values, opt-in via
         font-display class), mono: JetBrains Mono (IDs / counts / dates).
         See docs/obli-design-system.md §3 + §11. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Obliance</title>
    <!-- FOUC prevention: apply the saved theme (especially the light
         Obli Daylight) before the JS bundle boots, so a reload doesn't flash
         the wrong palette. Mirrors the allowlist in utils/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('oa-theme');
        if (t === 'obli-operator' || t === 'obli-daylight' || t === 'modern' || t === 'neon') {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
    <style>[data-theme="obli-daylight"] body { background: #fafbfd; }</style>
  </head>
  <body class="bg-bg-primary text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
