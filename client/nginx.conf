# conf.d/default.conf — included inside the http{} block of nginx-main.conf.
# `map` and `upstream` are http-context directives, valid here.

# WebSocket-aware Connection header. For an upgrade request (agent command
# channel, Socket.io, remote tunnels) this yields "upgrade"; for a normal
# request it yields "" (empty), which is what lets nginx REUSE upstream
# keepalive connections instead of opening a fresh TCP+handshake per request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Keepalive pool to the Node server. Without this, ~200 agent req/s = ~200 new
# TCP connections/s to Node + a flood of TIME_WAIT sockets. The pool reuses a
# small set of persistent upstream connections for all non-WS traffic.
upstream obliance_server {
    server server:3001;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression (text types only) ───────────────────────────────────────
    # The SPA is one multi-MB bundle plus the locale JSONs: on cellular (the
    # Android app, docs/obli-mobile.md) gzip cuts the first load several-fold.
    # Binary payloads are deliberately NOT listed: the APK
    # (application/vnd.android.package-archive), MSI/exe agent installers,
    # images and fonts are already compressed. text/html is always included.
    # gzip only applies when the client sends Accept-Encoding: gzip.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Obligate SSO callback (browser redirect)
    location /auth/ {
        proxy_pass http://obliance_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Agent hot path (push firehose + command WS + poll) ──────────────────
    # Longest-prefix match wins, so this is chosen over /api/ for agent traffic.
    # access_log OFF: at 2000 devices this path alone is ~400 req/s = ~35M log
    # lines/day funnelled through the Docker json-file logger — pure overhead.
    location /api/agent/ {
        access_log off;
        # Machine-to-machine firehose: keep it byte-identical to before the
        # server-level gzip above (no per-request compression CPU at ~400 req/s).
        gzip off;
        proxy_pass http://obliance_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        # The command channel (/api/agent/ws) is a long-lived WebSocket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API proxy (everything else under /api)
    location /api/ {
        proxy_pass http://obliance_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        # WebSocket tunnels must stay open as long as the session is active.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Software-repo uploads: MSI/EXE/PKG packages are large. The server
        # (multer) caps at 500 MB — nginx must not reject them first with a
        # 413 (default client_max_body_size is only 1 MB). Stream large bodies
        # straight to the upstream instead of buffering the whole file first.
        client_max_body_size 512M;
        proxy_request_buffering off;
    }

    # Socket.io proxy (browser real-time channel)
    location /socket.io/ {
        proxy_pass http://obliance_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check endpoint proxy
    location /health {
        access_log off;
        proxy_pass http://obliance_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Desktop app downloads — proxied to Express which serves from desktop-app/dist/
    # Must be listed before the SPA fallback or Nginx would serve index.html instead.
    location /downloads/ {
        proxy_pass http://obliance_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Allow large binary downloads without buffering issues
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated: it references content-hashed
    # bundles that disappear on every deploy. Without this, heuristic caching
    # (and the Android WebView's persistent HTTP cache, where there is no F5)
    # can serve a stale index.html pointing at deleted bundles → white screen.
    # `no-cache` = revalidate each time (cheap 304 via ETag/Last-Modified).
    # The try_files fallback above and the `index` directive both internally
    # redirect to /index.html, so every SPA route lands here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
