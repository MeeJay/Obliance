[versions]
# --- Toolchain ---------------------------------------------------------------
# AGP 9.x applies the Kotlin Gradle plugin itself ("built-in Kotlin"): applying
# org.jetbrains.kotlin.android on top is a hard error. The Kotlin version is
# therefore NOT a free choice: it must equal the KGP bundled with AGP
# (AGP 9.3.1 -> Kotlin 2.2.10). The Compose compiler plugin follows it.
agp = "9.3.1"
kotlin = "2.2.10"

# --- AndroidX ----------------------------------------------------------------
# compileSdk 37 is required by core 1.19 / compose-ui 1.12 / lifecycle 2.11.
coreKtx = "1.19.0"
appcompat = "1.7.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.08.00"
work = "2.11.2"
# WebViewCompat.addWebMessageListener / addDocumentStartJavaScript /
# getCurrentWebViewPackage.
webkit = "1.17.1"
# Custom Tabs for every link that leaves the configured server.
browser = "1.10.0"
# Latest STABLE biometric. It pulls appcompat, which is why the activities are
# AppCompat-themed (its API < 28 fingerprint dialog needs an AppCompat theme).
biometric = "1.1.0"

# --- Third party -------------------------------------------------------------
# Only the JsonElement tree API is used (no compiler plugin, no reflection),
# which keeps parsing pure-Kotlin and therefore testable on the JVM.
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"

# --- Test --------------------------------------------------------------------
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[bundles]
# material-icons-extended is deliberately absent (tens of MB of dex): icons are
# vector drawables in res/drawable.
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
]
